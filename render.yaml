# Render Blueprint — deploys the app as a Docker web service + managed Postgres.
#
# Render runs the existing Dockerfile (persistent Node server), so cron,
# YouTube resumable upload, and Drive streaming import all work exactly as on
# DigitalOcean. The every-minute publish trigger stays on the external pinger
# (cron-job.org) hitting /api/cron/publish — Render's built-in cron can't run
# sub-minute, and the external pinger is already configured.
#
# After first deploy: fill in the secret env vars in the Render dashboard
# (marked `sync: false`), and point OAuth redirect URIs at the Render URL.

databases:
  - name: promote-db
    databaseName: promote
    plan: free # free Postgres (expires after 90 days on free tier — upgrade or re-create)

services:
  - type: web
    name: promote
    runtime: docker
    plan: free # free web service (spins down after ~15 min idle, ~30s cold start)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    # NOTE: migrations are applied manually from your machine against the Render
    # DB (`DATABASE_URL=<render-url> npx prisma migrate deploy`) — see
    # RENDER_DEPLOY.md. The slim runtime image doesn't carry the Prisma CLI, so
    # we don't run migrate in a preDeploy hook.
    envVars:
      # Render injects the DB connection string from the managed Postgres above.
      - key: DATABASE_URL
        fromDatabase:
          name: promote-db
          property: connectionString
      # Render provides PORT; Next.js standalone binds to it. We also set it
      # explicitly so the Dockerfile's ENV PORT is overridden to Render's value.
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # ---- Public URL (fill in with the Render URL after first deploy) ----
      - key: AUTH_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_SECRET
        sync: false

      # ---- Google OAuth (login + Drive + YouTube) ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ---- Meta (Instagram + Facebook) ----
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v23.0

      # ---- LinkedIn ----
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

      # ---- Dropbox (cloud import) ----
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false

      # ---- Gemini (AI captions) ----
      - key: GEMINI_API_KEY
        sync: false

      # ---- Cloudinary (media) ----
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- Email (Gmail SMTP; Resend is the fallback) ----
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # ---- App secrets ----
      - key: CRON_SECRET
        sync: false
      - key: APPROVAL_TOKEN_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
